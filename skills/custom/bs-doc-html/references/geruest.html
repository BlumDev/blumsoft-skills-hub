<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI-Werkzeuge: Antrag, System und Gesprächsleitfaden</title>
<style>
:root{
  --bg:#ffffff; --bg-soft:#f6f7f9; --bg-card:#ffffff;
  --fg:#16191d; --fg-mute:#5b626b; --fg-faint:#878e97;
  --line:#e2e5e9; --line-strong:#c9ced5;
  --accent:#1f4e79; --accent-soft:#eaf1f8;
  --warn:#8a5a00; --warn-soft:#fdf5e3;
  --ok:#1f6b45; --ok-soft:#eaf5ee;
  --max:52rem;
}
html[data-theme="dark"]{
  --bg:#14171a; --bg-soft:#1b1f23; --bg-card:#1b1f23;
  --fg:#e8eaed; --fg-mute:#a5acb5; --fg-faint:#7b838d;
  --line:#2c3238; --line-strong:#3d454d;
  --accent:#7fb2e0; --accent-soft:#1d2a36;
  --warn:#e0b45c; --warn-soft:#2c2618;
  --ok:#79c79c; --ok-soft:#182a21;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.62; letter-spacing:.005em;
}
.wrap{max-width:var(--max); margin:0 auto; padding:4rem 1.6rem 6rem}
h1,h2,h3{line-height:1.25; letter-spacing:-.015em; margin:0}
h1{font-size:2rem; font-weight:650}
h2{font-size:1.3rem; font-weight:640; margin:3.4rem 0 1rem; padding-bottom:.5rem; border-bottom:2px solid var(--line-strong)}
h3{font-size:1.02rem; font-weight:640; margin:1.9rem 0 .5rem}
h4{font-size:.9rem; font-weight:660; margin:1.3rem 0 .35rem; color:var(--accent)}
p{margin:.75rem 0}
ul,ol{margin:.7rem 0; padding-left:1.3rem}
li{margin:.34rem 0}
li::marker{color:var(--fg-faint)}
strong{font-weight:640}
a{color:var(--accent)}
code{font-family:"Cascadia Mono",Consolas,monospace; font-size:.87em; background:var(--bg-soft); border:1px solid var(--line); border-radius:4px; padding:.08em .34em}

.masthead{border-bottom:3px solid var(--accent); padding-bottom:1.3rem; margin-bottom:.4rem}
.kicker{font-size:.72rem; font-weight:680; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); margin-bottom:.5rem}
.sub{color:var(--fg-mute); font-size:1.02rem; margin-top:.55rem}
.meta{display:flex; flex-wrap:wrap; gap:.5rem 1.6rem; margin-top:1.1rem; font-size:.83rem; color:var(--fg-faint)}

.tag{display:inline-block; font-size:.68rem; font-weight:680; letter-spacing:.09em; text-transform:uppercase; padding:.22rem .5rem; border-radius:3px; vertical-align:.15em; margin-left:.55rem}
.tag-ext{background:var(--ok-soft); color:var(--ok); border:1px solid var(--ok)}
.tag-int{background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn)}

.sheet{background:var(--bg-card); border:1px solid var(--line-strong); border-radius:8px; padding:2rem 2.1rem; margin:1.4rem 0}
.sheet h3:first-child{margin-top:0}

.note{border-left:3px solid var(--accent); background:var(--accent-soft); padding:.85rem 1.1rem; margin:1.2rem 0; border-radius:0 5px 5px 0; font-size:.95rem}
.note-warn{border-left-color:var(--warn); background:var(--warn-soft)}
.note .lbl{display:block; font-size:.7rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-mute); margin-bottom:.3rem}

table{width:100%; border-collapse:collapse; margin:1.1rem 0; font-size:.92rem}
th,td{text-align:left; padding:.6rem .7rem; border-bottom:1px solid var(--line); vertical-align:top}
th{font-size:.72rem; font-weight:680; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-mute); border-bottom:2px solid var(--line-strong)}
td:first-child{white-space:nowrap; font-weight:600}
tbody tr:last-child td{border-bottom:none}
table.free td:first-child{white-space:normal; font-weight:400}

.zone{display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin:1.2rem 0}
.zone > div{border:1px solid var(--line-strong); border-radius:7px; padding:1.1rem 1.2rem}
.zone .hd{font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:.5rem}
.zone .a{border-color:var(--ok); background:var(--ok-soft)}
.zone .a .hd{color:var(--ok)}
.zone .b{border-color:var(--warn); background:var(--warn-soft)}
.zone .b .hd{color:var(--warn)}
.zone ul{margin:.4rem 0 0; padding-left:1.1rem; font-size:.92rem}

.layer{border:1px solid var(--line-strong); border-left:4px solid var(--accent); border-radius:0 7px 7px 0; padding:1.2rem 1.4rem; margin:1.1rem 0; background:var(--bg-card)}
.layer .num{font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent)}
.layer h3{margin:.25rem 0 .5rem}
.layer p:last-child{margin-bottom:0}

.q{border-left:2px solid var(--line-strong); padding:.15rem 0 .15rem 1rem; margin:1.15rem 0}
.q .txt{font-weight:590}
.q .why{font-size:.87rem; color:var(--fg-mute); margin-top:.28rem}

.phase{display:grid; grid-template-columns:10rem 1fr; gap:1.2rem; padding:1rem 0; border-bottom:1px solid var(--line)}
.phase:last-child{border-bottom:none}
.phase .when{font-size:.8rem; font-weight:680; color:var(--accent); text-transform:uppercase; letter-spacing:.05em; padding-top:.15rem}
.phase .what strong{display:block; margin-bottom:.2rem}
.phase .what p{margin:0; font-size:.93rem; color:var(--fg-mute)}

.src{font-size:.83rem; color:var(--fg-mute)}
.src li{margin:.25rem 0}

#tt{position:fixed; top:1rem; right:1rem; z-index:9; background:var(--bg-card); color:var(--fg-mute); border:1px solid var(--line-strong); border-radius:6px; padding:.42rem .75rem; font:inherit; font-size:.78rem; cursor:pointer}
#tt:hover{color:var(--fg); border-color:var(--accent)}

@media (max-width:640px){ .zone{grid-template-columns:1fr} .phase{grid-template-columns:1fr; gap:.3rem} .wrap{padding:3.4rem 1.1rem 4rem} #tt{top:.5rem; right:.5rem; font-size:.7rem; padding:.28rem .55rem} }
@media print{
  #tt{display:none}
  html[data-theme]{--bg:#fff;--bg-soft:#f6f7f9;--bg-card:#fff;--fg:#000;--fg-mute:#444;--fg-faint:#666;--line:#ddd;--line-strong:#999;--accent:#1f4e79}
  body{font-size:10.5pt}
  .wrap{max-width:none; padding:0}
  h2{page-break-after:avoid}
  .sheet,.note,.zone,.q,.layer{page-break-inside:avoid}
  .pb{page-break-before:always}
  @page{margin:18mm 16mm}
}

/* ---------- Referenzkarten-Modus (dense) ---------- */
body.dense{ font-size:15px; line-height:1.45 }
body.dense .wrap{ max-width:68rem; padding:2rem 1.4rem 3rem }
body.dense h1{ font-size:1.6rem }
body.dense h2{ font-size:1.05rem; margin:1.8rem 0 .6rem; padding-bottom:.3rem }
body.dense h3{ font-size:.92rem; margin:1rem 0 .35rem }
body.dense p{ margin:.4rem 0 }
body.dense li{ margin:.18rem 0 }
body.dense table{ font-size:.85rem }
body.dense th,body.dense td{ padding:.35rem .5rem }

/* ---------- Kartenraster ---------- */
.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr)); gap:.8rem; margin:1rem 0 }
.cards.two{ grid-template-columns:repeat(auto-fit,minmax(20rem,1fr)) }
.card{ border:1px solid var(--line-strong); border-radius:7px; padding:.85rem 1rem; background:var(--bg-card) }
.card > .t{ font-size:.72rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); margin-bottom:.4rem }
.card p:first-of-type{ margin-top:0 }
.card p:last-child, .card ul:last-child{ margin-bottom:0 }
.card ul{ margin:.3rem 0; padding-left:1.05rem }
.card.warn{ border-color:var(--warn); background:var(--warn-soft) }
.card.warn > .t{ color:var(--warn) }
.card.ok{ border-color:var(--ok); background:var(--ok-soft) }
.card.ok > .t{ color:var(--ok) }

/* ---------- Kleinteile ---------- */
.kbd{ font-family:"Cascadia Mono",Consolas,monospace; font-size:.8em; border:1px solid var(--line-strong); border-bottom-width:2px; border-radius:4px; padding:.05em .35em; background:var(--bg-soft); white-space:nowrap }
.pill{ display:inline-block; font-size:.7rem; font-weight:680; letter-spacing:.05em; padding:.12rem .45rem; border-radius:99px; border:1px solid var(--line-strong); color:var(--fg-mute); white-space:nowrap }
.pill.ok{ border-color:var(--ok); color:var(--ok); background:var(--ok-soft) }
.pill.warn{ border-color:var(--warn); color:var(--warn); background:var(--warn-soft) }

/* ---------- Diagramme ---------- */
figure.fig{ margin:1.4rem 0; text-align:center }
figure.fig svg{ max-width:100%; height:auto }
figure.fig figcaption{ margin-top:.5rem; font-size:.82rem; color:var(--fg-mute); text-align:left }
svg .d-box{ fill:var(--bg-card); stroke:var(--line-strong); stroke-width:1.5 }
svg .d-box-a{ fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5 }
svg .d-box-ok{ fill:var(--ok-soft); stroke:var(--ok); stroke-width:1.5 }
svg .d-box-warn{ fill:var(--warn-soft); stroke:var(--warn); stroke-width:1.5 }
svg .d-line{ stroke:var(--line-strong); stroke-width:1.5; fill:none }
svg .d-line-a{ stroke:var(--accent); stroke-width:1.5; fill:none }
svg .d-dash{ stroke:var(--fg-faint); stroke-width:1.5; fill:none; stroke-dasharray:5 4 }
svg .d-t{ fill:var(--fg); font-family:"Segoe UI",system-ui,sans-serif; font-size:13px }
svg .d-t-b{ fill:var(--fg); font-family:"Segoe UI",system-ui,sans-serif; font-size:13px; font-weight:640 }
svg .d-t-s{ fill:var(--fg-mute); font-family:"Segoe UI",system-ui,sans-serif; font-size:11px }
svg .d-t-a{ fill:var(--accent); font-family:"Segoe UI",system-ui,sans-serif; font-size:11px; font-weight:680; letter-spacing:.06em }
svg .d-fill-line{ fill:var(--line-strong) }
svg .d-fill-accent{ fill:var(--accent) }

@media print{
  body.dense{ font-size:9pt }
  .cards{ gap:.5rem }
  .card,figure.fig{ page-break-inside:avoid }
}
</style>
</head>
<body>
<button id="tt" type="button">Hell / Dunkel (T)</button>
<div class="wrap">

<!-- INHALT -->

</div>
<script>
(function(){
  var b=document.getElementById('tt'), r=document.documentElement;
  function set(t){ r.setAttribute('data-theme',t); try{localStorage.setItem('ki-doc-theme',t)}catch(e){} }
  try{ var s=localStorage.getItem('ki-doc-theme'); if(s) r.setAttribute('data-theme',s); }catch(e){}
  b.addEventListener('click',function(){ set(r.getAttribute('data-theme')==='dark'?'light':'dark') });
  document.addEventListener('keydown',function(e){ if((e.key==='t'||e.key==='T')&&!e.ctrlKey&&!e.altKey&&!e.metaKey) b.click() });
})();
</script>
</body>
</html>
